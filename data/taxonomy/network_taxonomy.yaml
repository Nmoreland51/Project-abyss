  - id: usenet
    name: Usenet
    aliases: [Netnews]
    kind: system
    lifecycle: operational
    layers: [application, information_ecosystem]
    topology: [federated, decentralized]
    resource_identification_types: [message_id, topic_hierarchy]
    discovery_types: [flooding, directory_listing]
    patterns: [store_and_forward_flooding, federation]
    related: [federated, arpanet, www]
    last_reviewed: 2026-11-24
    facets:
      origin:
        basis: sourced
        text: >-
          Grew out of the UNIX ecosystem, built on UNIX's built-in UUCP communication. The commonly cited 1979-1980
          Duke University origin is unverified in this version.
        citations:
          - ref: isoc_brief_history
            quote: "spawned USENET, based on UNIX' built-in UUCP communication protocols"
      purpose:
        basis: sourced
        text: >-
          Distributing news articles so that each reader can see all articles in the newsgroups they take part in.
        citations:
          - ref: rfc5537
            quote: "These protocols most commonly use a flooding algorithm that propagates copies throughout a network of participating servers."
      public_disclosure:
        basis: sourced
        text: >-
          The message format was published as RFC 850 (1983) and RFC 1036 (1987), and NNTP as RFC 977 (1986).
        citations:
          - ref: rfc850
            quote: "Standard for Interchange of USENET Messages"
          - ref: rfc1036
            quote: "December 1987 Standard for Interchange of USENET Messages"
      architecture:
        basis: sourced
        text: >-
          A federation of news servers. Articles flood between peered servers, usually with one stored copy per server
          served to local readers. Usenet is one particular public network built on the Netnews protocols.
        citations:
          - ref: rfc5537
            quote: "Typically, only one copy is stored per server"
          - ref: rfc5537
            quote: "\"Usenet\" is a particular worldwide, publicly accessible network based on the Netnews protocols."
      protocols:
        basis: sourced
        text: UUCP historically, then NNTP (RFC 977, superseded by RFC 3977).
        citations:
          - ref: rfc977
            quote: "NNTP specifies a protocol for the distribution, inquiry, retrieval, and posting of news articles"
          - ref: rfc3977
            quote: "Network News Transfer Protocol (NNTP)"
      resource_identification:
        basis: sourced
        text: >-
          Articles have globally unique Message-IDs, and newsgroups form a topic hierarchy. The RFC 1036 format defines both.
        citations:
          - ref: rfc1036
            quote: "Message-ID"
      discovery:
        basis: analysis
        text: >-
          Subscribing to newsgroups in the hierarchy, with articles arriving by flooding. Archives (third-party) provide
          search over historical posts.
      documentation:
        basis: sourced
        text: RFCs 850, 1036, 977, 3977 and 5537.
        citations:
          - ref: rfc5537
            quote: "Netnews Architecture and Protocols"
      infrastructure_relationship:
        basis: sourced
        text: >-
          Originally over UUCP dial-up links, then over the Internet through NNTP. Netnews protocols are also used inside
          private deployments separate from Usenet.
        citations:
          - ref: rfc5537
            quote: "there are deployments of the Netnews protocols other than Usenet"
      distinguishing_characteristics:
        basis: analysis
        text: >-
          An early large-scale federated information ecosystem with no central server. Content is replicated by
          flooding, and a "Path" header records propagation.
      limitations:
        basis: analysis
        text: >-
          Server retention limits mean history is lost unless archived. Spam and abuse controls rely on operator
          cooperation. Native NNTP (port 119) is closed in the current cloud environment.
      comparison:
        basis: analysis
        text: >-
          A federation pattern later reused by email-like and social systems (ActivityPub, Matrix), where Usenet
          floods while ActivityPub delivers to subscribers. Berners-Lee's 1991 WWW description was posted to a
          Usenet group (alt.hypertext), so Usenet was one channel through which the Web became known.

