# Project Abyss network taxonomy: machine-readable source of truth.
# Schema: abyss/foundation/taxonomy.py. Human-readable rendering: docs/NETWORK_TAXONOMY.md (generated).
# Rules: every 'sourced' facet carries verbatim quotes that `python -m abyss verify-citations` checks
# against live retrievals. 'analysis' = synthesis by the Abyss authors. 'unverified' = commonly stated,
# but not checked against a retrieved source in this version; it must not be used as evidence.
schema_version: 0.1.0
taxonomy_version: 0.1.0
released: 2026-11-24
description: >-
  Phase 0 taxonomy of information networks and architectural patterns named in the owner's directive
  (section 3). Systems (concrete networks) and patterns/categories (architectural families) are kept as
  different kinds, because mixing them in one flat label set would make classification targets ambiguous
  (IPFS is both a system and an instance of the DHT and P2P patterns). Layers separate physical
  infrastructure, transport, overlay, application and information ecosystem, as MASTER_AUDIT section 2 requires.

vocabulary:
  layers:
    physical: Physical media and radio links (fibre, copper, Wi-Fi radio, LoRa).
    link: Link-layer framing and local delivery, including layer-2 mesh routing.
    network: Internetworking, addressing and routing (IP, BGP, early ARPANET host-IMP networking).
    transport: End-to-end transport (TCP, UDP, QUIC).
    overlay: A logical network formed by end hosts on top of an existing network (onion routing, DHTs, overlay IPv6).
    application: Application protocol and data formats (HTTP, Gopher, Gemini, NNTP, SMTP, ActivityPub).
    information_ecosystem: The content, naming conventions, communities and discovery practices that grow around a system.
  topology:
    centralized: A single operator or server is required for core function.
    client_server: Clients request resources from servers that hold them.
    hierarchical: Tree-structured delegation (e.g. naming or newsgroup hierarchies).
    decentralized: Many independent operators, with no single point of control for the whole.
    distributed: Function spread across many nodes that cooperate algorithmically.
    federated: Independent servers interoperate through a common server-to-server protocol.
    peer_to_peer: Participants act as both clients and servers.
    friend_to_friend: Peers connect only to explicitly trusted peers.
    hybrid: Combines a central component with distributed operation (e.g. a tracker plus a P2P swarm).
  resource_identification:
    location_url: A URL naming a host and a path; identifies where, not what.
    host_selector: Host, port and an opaque selector string (Gopher).
    content_hash: Identifier derived from a cryptographic hash of the content.
    public_key: Identifier derived from a public key (self-certifying address or name).
    network_address: Numeric network address (ARPANET host numbers, IPv4/IPv6 addresses).
    message_id: A globally unique message identifier.
    topic_hierarchy: Hierarchical topic names (e.g. newsgroup names).
    user_at_domain: Account identifiers scoped to a server's domain (user@host).
    name_prefix: Hierarchical names for data, routed by prefix.
    human_name_registry: Human-readable names resolved through a naming system or registry.
  discovery:
    hyperlinks: Following links embedded in documents.
    search_engine: Crawler-built indexes queried by users.
    directory_listing: Curated directories or menus.
    consensus_directory: A signed directory of network nodes distributed to clients.
    dht_lookup: Iterative lookup in a distributed hash table.
    flooding: Propagating copies of items to all participating peers or servers.
    tracker: A central coordinator that introduces peers to each other.
    out_of_band: Addresses or keys shared outside the system (word of mouth, other websites).
    manual_peering: Operators configure peer links by hand.
    routing_announcements: Routing protocol advertisements between nodes.
    federation_protocol: Server-to-server delivery and subscription.
    naming_resolution: Resolving names through a naming system.
  patterns:
    packet_switching: Data split into independently routed packets.
    client_server: Request/response between clients and servers.
    hypertext: Documents with embedded links to other documents.
    menu_hierarchy: Navigation through hierarchical menus of items.
    onion_routing: Layered encryption over a multi-hop circuit; each relay removes one layer.
    garlic_routing: Bundling several encrypted messages into one layered message over unidirectional tunnels.
    distributed_hash_table: Key-to-node mapping spread across participants.
    content_addressing: Retrieval by identifier derived from the content itself.
    self_certifying_names: Names that embed or derive from a key, so possession of the name authenticates the holder.
    store_and_forward_flooding: Servers store items and forward copies to neighbours.
    federation: Interoperation of independently operated servers.
    swarming: Many downloaders exchange pieces of the same content with each other.
    mesh_routing: Nodes route for each other over multi-hop links without fixed infrastructure.
    small_world_routing: Greedy routing that exploits a small-world graph of peer connections.
    blockchain_naming: Names registered on a blockchain (e.g. Namecoin .bit).
    trust_on_first_use: Accept and pin a peer's key or certificate on first contact.
    private_addressing: Address space reserved for networks not routed on the public Internet.
    tunneling: Encapsulating one network's traffic inside another's.
    zero_trust: No implicit trust based on network location.
    information_centric_networking: The network routes requests for named data rather than to host addresses.
    path_aware_networking: End hosts can see and choose inter-domain paths.

entries:
  # =====================================================================================
  - id: arpanet
    name: ARPANET
    kind: system
    lifecycle: historical
    layers: [physical, network, transport, application]
    topology: [distributed]
    resource_identification_types: [network_address]
    discovery_types: [out_of_band, directory_listing]
    patterns: [packet_switching]
    related: [www, usenet, private_intranet]
    last_reviewed: 2026-11-24
    facets:
      origin:
        basis: sourced
        text: >-
          The first Interface Message Processor (IMP) was installed by BBN at UCLA in September 1969, and four
          hosts were connected by the end of 1969. RFC 1, the first memo of the RFC series, is dated 7 April 1969.
        citations:
          - ref: isoc_brief_history
            quote: "in September 1969 when BBN installed the first IMP at UCLA and the first host computer was connected"
          - ref: isoc_brief_history
            quote: "by the end of 1969, four host computers were connected together into the initial ARPANET"
          - ref: rfc1
            quote: "Date: 7 April 1969"
      purpose:
        basis: sourced
        text: >-
          Resource sharing: giving users access to expensive remote computing resources instead of duplicating them.
        citations:
          - ref: isoc_brief_history
            quote: "A major initial motivation for both the ARPANET and the Internet was resource sharing"
      public_disclosure:
        basis: sourced
        text: >-
          A large public demonstration at the International Computer Communication Conference (ICCC) in 1972,
          described by participants as the first public demonstration. The RFC series also made the design visible
          as it was being built.
        citations:
          - ref: isoc_brief_history
            quote: "Kahn organized a large, very successful demonstration of the ARPANET at the International Computer Communication Conference (ICCC)"
          - ref: isoc_brief_history
            quote: "This was the first public demonstration of this new network technology to the public."
      architecture:
        basis: sourced
        text: >-
          A packet-switched network of IMPs specified by BBN, with host computers attached to the IMPs. Host-to-host
          software was each host group's responsibility, coordinated through the RFC process.
        citations:
          - ref: rfc1
            quote: "The software for the ARPA Network exists partly in the IMPs and partly in the respective HOSTs."
          - ref: rfc1
            quote: "BB&N has specified the software of the IMPs and it is the responsibility of the HOST groups to agree on HOST software."
      protocols:
        basis: sourced
        text: >-
          The host-to-host Network Control Program (NCP), later replaced by IP/TCP. RFC 801 set out the plan for a complete
          switch from NCP to IP/TCP by 1 January 1983. It is a plan document, not a record of execution.
        citations:
          - ref: rfc801
            quote: "The goal is to make a complete switch over from the NCP to IP/TCP by 1 January 1983."
      resource_identification:
        basis: unverified
        text: >-
          Hosts were identified by numeric host/IMP addresses, and names were mapped through centrally maintained host
          tables before DNS. Commonly stated, but no primary source for the naming mechanism was retrieved in this version.
      discovery:
        basis: unverified
        text: >-
          There was no search mechanism. Resources were learned through RFCs, network information centre directories
          and personal contact. Not checked against a retrieved source in this version.
      documentation:
        basis: sourced
        text: The Request for Comments (RFC) series, begun in 1969, is the primary public documentation.
        citations:
          - ref: isoc_brief_history
            quote: "In 1969 a key step was taken by S. Crocker (then at UCLA) in establishing the Request for Comments (or RFC) series of notes."
      infrastructure_relationship:
        basis: analysis
        text: >-
          ARPANET was itself infrastructure (dedicated switching nodes). It is the ancestor of the Internet layer that
          later overlays (Tor, I2P, IPFS) run on, rather than an overlay itself.
      distinguishing_characteristics:
        basis: analysis
        text: >-
          For Abyss, ARPANET is the reference case of a network whose existence and design became public through
          incremental, openly circulated specifications plus a staged public demonstration. That disclosure pattern
          (specs, then demo, then papers) can be used as a template when assessing how other networks became known.
      limitations:
        basis: analysis
        text: >-
          Historical system: there is no live observation, and all evidence is documentary. Participant
          retrospectives (isoc_brief_history) are authoritative but not contemporaneous, so they need corroboration
          with period documents (RFCs).
      comparison:
        basis: analysis
        text: >-
          Shares packet switching with all later Internet systems. Unlike the overlays in this taxonomy it owned its
          switching layer. Unlike private intranets it was a multi-institution research network documented in public.
    open_questions:
      - "Register a primary source for host naming (e.g. RFCs on host tables) to upgrade resource_identification."

  # =====================================================================================
  - id: www
    name: World Wide Web
    kind: system
    aliases: [WWW, the Web]
    lifecycle: operational
    layers: [application, information_ecosystem]
    topology: [client_server, decentralized]
    resource_identification_types: [location_url, human_name_registry]
    discovery_types: [hyperlinks, search_engine, directory_listing]
    patterns: [client_server, hypertext]
    related: [gopher, gemini, arpanet, usenet]
    last_reviewed: 2026-11-24
    facets:
      origin:
        basis: sourced
        text: >-
          Proposed by Tim Berners-Lee at CERN in "Information Management: A Proposal", written in March 1989 and
          redistributed in May 1990. CERN hosts the first website at info.cern.ch.
        citations:
          - ref: w3c_tbl_proposal_1989
            quote: "Information Management: A Proposal"
          - ref: w3c_tbl_proposal_1989
            quote: "written in March 1989 and later redistributed unchanged apart from the date added in May 1990"
          - ref: cern_info_first_website
            quote: "home of the first website"
      purpose:
        basis: sourced
        text: To manage general information about accelerators and experiments at CERN and to prevent its loss.
        citations:
          - ref: w3c_tbl_proposal_1989
            quote: "This proposal concerns the management of general information about accelerators and experiments at CERN."
      public_disclosure:
        basis: sourced
        text: >-
          Among the early public descriptions is Berners-Lee's August 1991 Usenet post to alt.hypertext describing the
          WorldWideWeb project. This version doesn't establish whether it was the first public announcement.
        citations:
          - ref: w3c_tbl_alt_hypertext_1991
            quote: "Newsgroups: alt.hypertext"
          - ref: w3c_tbl_alt_hypertext_1991
            quote: "The WorldWideWeb (WWW) project aims to allow links to be made to any information anywhere."
      architecture:
        basis: sourced
        text: >-
          A client-server hypertext system. Documents on independently operated servers link to each other by URI, and
          HTTP is the transfer protocol.
        citations:
          - ref: rfc9110
            quote: "for distributed, collaborative, hypertext information systems"
      protocols:
        basis: sourced
        text: HTTP (semantics in RFC 9110) and the URI generic syntax (RFC 3986). HTML is not cited in this version.
        citations:
          - ref: rfc9110
            quote: "HTTP Semantics"
          - ref: rfc3986
            quote: "This specification defines the generic URI syntax"
      resource_identification:
        basis: sourced
        text: >-
          Uniform Resource Identifiers. Web URLs combine an access method (scheme), a host and a path, so they identify
          a location rather than the content itself.
        citations:
          - ref: rfc3986
            quote: "A Uniform Resource Identifier (URI) is a compact sequence of characters that identifies an abstract or physical resource."
          - ref: w3c_tbl_alt_hypertext_1991
            quote: "The address format includes an access method (=namespace), and for most name spaces a hostname and some sort of path."
      discovery:
        basis: analysis
        text: >-
          Following hyperlinks, curated directories and, mainly, crawler-based search engines. Content that isn't
          linked or indexed is effectively undiscoverable to most users. That gap is the premise of the Abyss
          hidden-value engine.
      documentation:
        basis: sourced
        text: IETF RFCs (HTTP, URI) plus W3C and WHATWG specifications (the latter are not registered in this version).
        citations:
          - ref: rfc9110
            quote: "HTTP Semantics"
      infrastructure_relationship:
        basis: analysis
        text: >-
          An application-layer system running over the Internet's transport and naming (TCP/QUIC, DNS). It is not the
          Internet itself, which is the distinction MASTER_AUDIT section 1 draws.
      distinguishing_characteristics:
        basis: analysis
        text: >-
          One address format spanning many access methods, so the Web could link into pre-existing systems (Gopher,
          news) instead of replacing them. Publication needs only a server, not anyone's permission.
      limitations:
        basis: analysis
        text: >-
          Location addressing means links break when content moves (no built-in integrity or persistence). Discovery is
          concentrated in a small number of commercial search indexes, which define what counts as "findable".
      comparison:
        basis: analysis
        text: >-
          Compared with Gopher: free-form hypertext instead of menus. Compared with Gemini: richer and extensible, where
          Gemini deliberately constrains features. Compared with IPFS: location-addressed, where IPFS is content-addressed.

  # =====================================================================================
  - id: tor
    name: Tor
    aliases: [The Onion Router, onion services]
    kind: system
    lifecycle: operational
    layers: [overlay, information_ecosystem]
    topology: [decentralized, client_server]
    resource_identification_types: [location_url, public_key]
    discovery_types: [consensus_directory, out_of_band]
    patterns: [onion_routing, self_certifying_names]
    related: [i2p, hyphanet, gnunet]
    last_reviewed: 2026-11-24
    facets:
      origin:
        basis: sourced
        text: >-
          Onion routing began in 1995 with Goldschlag, Reed and Syverson at the U.S. Naval Research Lab. The Tor
          network was first deployed in October 2002, and the Tor Project, Inc. was founded as a nonprofit in 2006.
        citations:
          - ref: tor_history
            quote: "in 1995, David Goldschlag, Michael G. Reed, and Paul Syverson at the U.S. Naval Research Lab (NRL)"
          - ref: tor_history
            quote: "in October 2002 when the Tor network was initially deployed, its code was released under a free and open software license"
          - ref: tor_history
            quote: "In 2006, the Tor Project, Inc., a 501(c)(3) nonprofit organization, was founded"
      purpose:
        basis: sourced
        text: To anonymize low-latency TCP-based applications such as web browsing, SSH and instant messaging.
        citations:
          - ref: tor_spec_intro
            quote: "Tor is a distributed overlay network designed to anonymize low-latency TCP-based applications"
      public_disclosure:
        basis: sourced
        text: >-
          The code was released under a free licence at deployment in 2002, and the design was published at USENIX
          Security 2004 ("Tor: The Second-Generation Onion Router").
        citations:
          - ref: tor_design_2004
            quote: "Tor: The Second-Generation Onion Router"
          - ref: tor_design_2004
            quote: "We present Tor, a circuit-based low-latency anonymous communication service."
      architecture:
        basis: sourced
        text: >-
          A circuit-based overlay of volunteer relays. Clients download a signed directory of relays and build multi-hop
          circuits. The second-generation design added perfect forward secrecy, congestion control, directory servers
          and location-hidden services through rendezvous points.
        citations:
          - ref: tor_spec_intro
            quote: "To connect to the network, a client needs to download an up-to-date signed directory of the relays on the network."
          - ref: tor_design_2004
            quote: "adding perfect forward secrecy, congestion control, directory servers, integrity checking, configurable exit policies, and a practical design for location-hidden services via rendezvous points"
      protocols:
        basis: sourced
        text: >-
          The Tor protocol (cells over TLS between relays) and the onion-service (rendezvous) protocol, both specified at
          spec.torproject.org. Cell and TLS details are cited only at the level of the specification index in this version.
        citations:
          - ref: tor_rend_spec_overview
            quote: "Hidden services aim to provide responder anonymity for bidirectional stream-based communication on the Tor network."
      resource_identification:
        basis: unverified
        text: >-
          Ordinary web resources are reached by URL through exit relays. Onion services use .onion addresses derived from
          the service's public key (self-certifying). The key-derivation details were not quoted from the specification
          in this version.
      discovery:
        basis: analysis
        text: >-
          Relays are discovered through the signed consensus directory. Onion services aren't globally enumerable by
          design: their addresses spread out of band (links, lists). Abyss must not attempt to enumerate them.
      documentation:
        basis: sourced
        text: Public specifications at spec.torproject.org and peer-reviewed design papers.
        citations:
          - ref: tor_spec_intro
            quote: "A short introduction to Tor"
      infrastructure_relationship:
        basis: analysis
        text: >-
          An overlay on the public Internet. Relays are ordinary Internet hosts, and exit relays connect to ordinary
          Internet services. It depends on TCP/IP and, for bootstrapping, on reachable directory authorities.
      distinguishing_characteristics:
        basis: analysis
        text: >-
          Client anonymity for low-latency streams through a directory-coordinated relay set. Responder anonymity comes
          through onion services. Directory authorities are a semi-centralized trust anchor in an otherwise distributed system.
      limitations:
        basis: analysis
        text: >-
          Low-latency design trades resistance to global traffic analysis for usability. The directory authority set is
          a centralization point. For Abyss, onion-service content is out of scope in Phase 0 (see SCOPE_AND_RESTRICTIONS.md).
      comparison:
        basis: analysis
        text: >-
          Compared with I2P: bidirectional circuits and an exit-to-Internet focus, where I2P uses unidirectional tunnels
          and an internal-services focus. Compared with Hyphanet: real-time streams, where Hyphanet is store-and-retrieve publication.

  # =====================================================================================
  - id: i2p
    name: I2P
    aliases: [Invisible Internet Project]
    kind: system
    lifecycle: operational
    layers: [overlay, information_ecosystem]
    topology: [distributed, peer_to_peer]
    resource_identification_types: [public_key, human_name_registry]
    discovery_types: [dht_lookup, out_of_band]
    patterns: [garlic_routing, distributed_hash_table, self_certifying_names]
    related: [tor, hyphanet, gnunet]
    last_reviewed: 2026-11-24
    facets:
      origin:
        basis: sourced
        text: >-
          In active development since early 2003. The project's technical introduction was originally written by
          jrandom in 2003.
        citations:
          - ref: i2p_intro
            quote: "It has been in active development since early 2003"
          - ref: i2p_intro
            quote: "This document was originally written by jrandom in 2003."
      purpose:
        basis: sourced
        text: >-
          To provide an anonymous network layer on which anonymity- or security-conscious applications can run with
          their own latency and throughput trade-offs.
        citations:
          - ref: i2p_intro
            quote: "I2P is a scalable, self organizing, resilient packet switched anonymous network layer, upon which any number of different anonymity or security conscious applications can operate."
      public_disclosure:
        basis: unverified
        text: >-
          Open-source development with public documentation from the start. The project's own history page wasn't
          retrieved in this version, so details of the early announcement are unverified.
      architecture:
        basis: sourced
        text: >-
          A packet-switched overlay of peer routers using unidirectional tunnels. Garlic encryption bundles multiple
          messages, and a network database (netDb) DHT is served by "floodfill" routers.
        citations:
          - ref: i2p_intro
            quote: "I2P is an overlay network designed to be run on top of a functional packet switched network"
          - ref: i2p_intro
            quote: "lets Alice's router wrap up multiple messages into a single \"garlic message\""
          - ref: i2p_intro
            quote: "Those routers that do participate in the DHT and respond to leaseset lookups are called 'floodfills'."
      protocols:
        basis: unverified
        text: >-
          Router-to-router transports (NTCP2 and SSU2 at the time of writing) carry tunnel messages. The specific
          transport names were not quoted in this version.
      resource_identification:
        basis: unverified
        text: >-
          Services are identified by cryptographic destinations (public-key based), with human-readable names through a
          local address book. The page's "Naming Library and Address Book" appendix exists, but its claims weren't quoted.
      discovery:
        basis: sourced
        text: >-
          Leasesets (how to reach a destination) and router information are found through the netDb DHT, served by
          floodfill routers. Service addresses spread out of band.
        citations:
          - ref: i2p_intro
            quote: "Those routers that do participate in the DHT and respond to leaseset lookups are called 'floodfills'."
      documentation:
        basis: sourced
        text: Public documentation and specifications at geti2p.net. The intro page warns that parts may be obsolete.
        citations:
          - ref: i2p_intro
            quote: "some information may be obsolete or incomplete"
      infrastructure_relationship:
        basis: sourced
        text: An overlay on an existing packet-switched network (the Internet).
        citations:
          - ref: i2p_intro
            quote: "I2P is an overlay network designed to be run on top of a functional packet switched network"
      distinguishing_characteristics:
        basis: analysis
        text: >-
          Every participant is a router, and inbound and outbound paths are separate unidirectional tunnels. Garlic
          bundling is used, and the design favours services hosted inside the network over exit to the public Internet.
      limitations:
        basis: analysis
        text: >-
          Documentation self-describes as partly obsolete, so claims need current specifications. Floodfill routers are
          a concentration point for netDb.
      comparison:
        basis: analysis
        text: >-
          Compared with Tor: fully distributed netDb, where Tor has directory authorities, and packet tunnels, where Tor
          has TCP circuits. Compared with GNUnet: both are full-stack privacy-oriented P2P frameworks with their own naming.

  # =====================================================================================
  - id: hyphanet
    name: Hyphanet
    aliases: [Freenet (1999-2023 name), Fred]
    kind: system
    lifecycle: renamed
    layers: [overlay, application, information_ecosystem]
    topology: [peer_to_peer, friend_to_friend, distributed]
    resource_identification_types: [content_hash, public_key]
    discovery_types: [out_of_band, hyperlinks]
    patterns: [content_addressing, self_certifying_names, small_world_routing]
    related: [freenet, gnunet, i2p, ipfs]
    last_reviewed: 2026-11-24
    facets:
      origin:
        basis: sourced
        text: >-
          Started as the Freenet Project by Ian Clarke around July 1999, based on his paper "A Distributed Decentralised
          Information Storage and Retrieval System". In 2023 the original Freenet was renamed Hyphanet after the Freenet
          Project, Inc. board gave the "Freenet" name to its new project, Locutus.
        citations:
          - ref: hyphanet_about
            quote: "Ian started the Freenet Project around July of 1999"
          - ref: hyphanet_about
            quote: "Hyphanet is based on Ian's paper \"A Distributed Decentralised Information Storage and Retrieval System\""
          - ref: hyphanet_rename_2023
            quote: "decided to rename its new project Locutus to \"Freenet.\" This required that Freenet change its name."
      purpose:
        basis: sourced
        text: Censorship-resistant and privacy-respecting publishing and communication.
        citations:
          - ref: hyphanet_home
            quote: "Hyphanet is peer-to-peer network for censorship-resistant and privacy-respecting publishing and communication."
      public_disclosure:
        basis: sourced
        text: >-
          Disclosed through Clarke's paper and open development from 1999. The rename was announced publicly on
          26 June 2023.
        citations:
          - ref: hyphanet_rename_2023
            quote: "Freenet renamed to Hyphanet"
          - ref: hyphanet_rename_2023
            quote: "Freenet began development in 1999."
      architecture:
        basis: sourced
        text: >-
          A decentralized peer-to-peer data store. Nodes contribute bandwidth and disk ("data store") for encrypted
          chunks, and traffic is routed through other nodes. In "darknet" mode nodes connect only to friends.
        citations:
          - ref: hyphanet_about
            quote: "Communications by Hyphanet nodes are encrypted and routed through other nodes"
          - ref: hyphanet_about
            quote: "Users contribute to the network by giving bandwidth and a portion of their hard drive (called the \"data store\") for storing encrypted chunks of data."
          - ref: hyphanet_about
            quote: "if used in \"darknet\" mode, where users only connect to their friends, is very difficult to detect"
      protocols:
        basis: unverified
        text: >-
          Hyphanet's own node-to-node protocol (the "Fred" reference implementation). Routing is commonly described as
          small-world greedy routing. Not verified against a protocol specification in this version.
      resource_identification:
        basis: sourced
        text: >-
          Content Hash Keys (CHKs) guarantee integrity of retrieved data, and Signed Subspace Keys (SSKs) allow signed,
          updatable content.
        citations:
          - ref: hyphanet_docs
            quote: "Hyphanet has long-supported the concept of \"Content Hash Keys\" which guarantee the integrity of retrieved data."
          - ref: hyphanet_docs
            quote: "Hyphanet also supports \"Signed Subspace Keys\" which allow content to be digitally signed."
      discovery:
        basis: analysis
        text: >-
          No global search. Keys and freesite links spread out of band and through index sites inside the network.
          Content persists according to popularity, not by publisher guarantee.
      documentation:
        basis: sourced
        text: Project documentation at hyphanet.org, plus the founding paper.
        citations:
          - ref: hyphanet_docs
            quote: "Forward Error Correction"
      infrastructure_relationship:
        basis: analysis
        text: >-
          An overlay running on Internet hosts. It needs no servers, but bootstrapping in opennet mode depends on
          reachable seed nodes (not verified in this version).
      distinguishing_characteristics:
        basis: sourced
        text: >-
          Content-hash integrity, signed subspaces, forward error correction and "healing" of popular content. The
          darknet (friend-to-friend) mode is hard to detect.
        citations:
          - ref: hyphanet_docs
            quote: "Uniquely, Hyphanet also supports \"healing\""
      limitations:
        basis: analysis
        text: >-
          Unpopular content can disappear, so persistence isn't guaranteed. Naming history is confusing: sources
          before 2023 that say "Freenet" mean Hyphanet, and later ones may mean the new Freenet. Abyss entity resolution
          must handle this explicitly.
      comparison:
        basis: analysis
        text: >-
          Compared with IPFS: both are content-addressed, but Hyphanet adds anonymity and popularity-driven storage, while
          IPFS has no anonymity and pinning-based persistence. Compared with Tor and I2P: storage-centric rather than streams.
    open_questions:
      - "Register Clarke 1999/2001 papers and the Fred protocol docs to upgrade 'protocols' and 'public_disclosure'."
      - "Compare the rename account with the new Freenet project's account (only one side registered)."

