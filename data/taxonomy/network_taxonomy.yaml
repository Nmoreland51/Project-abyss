  - id: zeronet
    name: ZeroNet
    kind: system
    lifecycle: unknown
    layers: [overlay, application, information_ecosystem]
    topology: [peer_to_peer, hybrid]
    resource_identification_types: [public_key, human_name_registry]
    discovery_types: [tracker, out_of_band]
    patterns: [self_certifying_names, swarming, blockchain_naming]
    related: [ipfs, p2p, hyphanet]
    last_reviewed: 2026-11-24
    facets:
      origin:
        basis: unverified
        text: >-
          Commonly dated to 2015 and to a single original author. Neither is stated in the retrieved README, and the
          GitHub repository history couldn't be queried from this environment.
      purpose:
        basis: sourced
        text: Decentralized websites using Bitcoin cryptography and the BitTorrent network.
        citations:
          - ref: zeronet_readme
            quote: "Decentralized websites using Bitcoin crypto and the BitTorrent network"
      public_disclosure:
        basis: analysis
        text: Open-source repository and project website. Not investigated further in this version.
      architecture:
        basis: sourced
        text: >-
          Each visited site is also served by the visitor. Every site has a content.json manifest holding sha512
          hashes of all other files and a signature made with the site's private key. When the owner changes the
          site they sign a new content.json, and peers verify its integrity using the signature.
        citations:
          - ref: zeronet_readme
            quote: "Each visited site is also served by you."
          - ref: zeronet_readme
            quote: "Every site contains a `content.json` file which holds all other files in a sha512 hash and a signature generated using the site's private key."
          - ref: zeronet_readme
            quote: "the peers verify the `content.json` integrity (using the signature)"
      protocols:
        basis: sourced
        text: Peer discovery through the BitTorrent network, with its own file exchange and TLS-encrypted connections.
        citations:
          - ref: zeronet_readme
            quote: "it tries to find peers using the BitTorrent network so it can download the site files"
          - ref: zeronet_readme
            quote: "TLS encrypted connections"
      resource_identification:
        basis: sourced
        text: >-
          Sites are addressed by a site address whose private key the site owner holds. Namecoin .bit domains are
          supported for human-readable names.
        citations:
          - ref: zeronet_readme
            quote: "who has the private key for the site address"
          - ref: zeronet_readme
            quote: "Namecoin .bit domains support"
      discovery:
        basis: sourced
        text: >-
          When visiting a site, the client looks for peers through the BitTorrent network. How site addresses
          themselves spread wasn't investigated in this version.
        citations:
          - ref: zeronet_readme
            quote: "it tries to find peers using the BitTorrent network so it can download the site files"
      documentation:
        basis: sourced
        text: The repository README and the project website.
        citations:
          - ref: zeronet_readme
            quote: "How does it work?"
      infrastructure_relationship:
        basis: sourced
        text: >-
          Runs a local HTTP server, which users browse with an ordinary browser (127.0.0.1:43110). It reuses Bitcoin
          cryptography and BitTorrent peer discovery.
        citations:
          - ref: zeronet_readme
            quote: "http://127.0.0.1:43110/{zeronet_address}"
      distinguishing_characteristics:
        basis: sourced
        text: Real-time updated, signed, peer-served websites.
        citations:
          - ref: zeronet_readme
            quote: "Real-time updated sites"
      limitations:
        basis: unverified
        text: >-
          Maintenance status is unknown. Reports that the original repository is inactive and that forks exist couldn't
          be checked here (GitHub API blocked from this environment).
      comparison:
        basis: analysis
        text: >-
          Compared with IPFS: per-site signed manifests and BitTorrent-based discovery, where IPFS has a general
          content-addressed file system. Compared with Hyphanet: anonymity isn't part of the core design described in
          the README (its README links an .onion address, but Tor support wasn't verified).
    open_questions:
      - "Check maintenance status and forks from an environment with GitHub API access."

