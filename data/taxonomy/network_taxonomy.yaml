  - id: gemini
    name: Gemini
    aliases: [Project Gemini, Geminispace]
    kind: system
    lifecycle: operational
    layers: [application, information_ecosystem]
    topology: [client_server, decentralized]
    resource_identification_types: [location_url]
    discovery_types: [hyperlinks, search_engine, out_of_band]
    patterns: [client_server, hypertext, trust_on_first_use]
    related: [gopher, www]
    last_reviewed: 2026-11-24
    facets:
      origin:
        basis: sourced
        text: >-
          Project Gemini started in June 2019.
        citations:
          - ref: gemini_faq
            quote: "Project Gemini started in June 2019."
      purpose:
        basis: sourced
        text: To coexist alongside Gopher and the Web as one more option, explicitly not to replace them.
        citations:
          - ref: gemini_faq
            quote: "Gemini is not intended to replace either Gopher or the web, but to co-exist peacefully alongside them"
      public_disclosure:
        basis: analysis
        text: Developed in public, with its specification and FAQ published by the project.
      architecture:
        basis: sourced
        text: A single request, single response client-server protocol over TLS.
        citations:
          - ref: gemini_spec
            quote: "with a simple request and response transaction"
      protocols:
        basis: sourced
        text: >-
          The Gemini protocol on TCP port 1965 with mandatory TLS. Clients are strongly recommended to use
          Trust-On-First-Use certificate pinning.
        citations:
          - ref: gemini_spec
            quote: "It runs over TCP [STD7] port 1965 with encryption provided by TLS [RFC8446]"
          - ref: gemini_spec
            quote: "Clients are strongly RECOMMENDED to use a Trust on First Use or \"TOFU\" certificate-pinning system"
      resource_identification:
        basis: sourced
        text: gemini:// URIs (location-based).
        citations:
          - ref: gemini_spec
            quote: "gemini://example.net/search?hello"
      discovery:
        basis: analysis
        text: >-
          Links in gemtext documents, community aggregators and Gemini-native search engines. Total size is
          unmeasured by Abyss.
      documentation:
        basis: sourced
        text: Specification and FAQ at geminiprotocol.net (also served natively over Gemini).
        citations:
          - ref: gemini_spec
            quote: "This document specifies the Gemini protocol for file transfer."
      infrastructure_relationship:
        basis: analysis
        text: >-
          An application protocol over TCP/TLS on the Internet. It uses DNS hostnames, and TOFU avoids dependence on
          the CA system.
      distinguishing_characteristics:
        basis: sourced
        text: '"Geminispace" names the total collection of content served over Gemini, by analogy with Gopherspace.'
        citations:
          - ref: gemini_faq
            quote: "\"Geminispace\" is simply the total collection of every single file that is served via the Gemini protocol."
      limitations:
        basis: analysis
        text: >-
          Deliberately minimal (no inline media or scripting). Native port 1965 is closed in the current cloud
          environment, so the Phase 0 citations came from the project's HTTPS mirror and native ingestion is BLOCKED here.
      comparison:
        basis: sourced
        text: Positioned between Gopher and the Web, as an improvement over Gopher rather than a stripped-down HTTP.
        citations:
          - ref: gemini_spec
            quote: "It can be thought of as an incremental improvement over Gopher [RFC1436] rather than a stripped down HTTP"

  # =====================================================================================
  - id: usenet
    name: Usenet
    aliases: [Netnews]
    kind: system
    lifecycle: operational
    layers: [application, information_ecosystem]
    topology: [federated, decentralized]
    resource_identification_types: [message_id, topic_hierarchy]
    discovery_types: [flooding, directory_listing]
    patterns: [store_and_forward_flooding, federation]
    related: [federated, arpanet, www]
    last_reviewed: 2026-11-24
    facets:
      origin:
        basis: sourced
        text: >-
          Grew out of the UNIX ecosystem, built on UNIX's built-in UUCP communication. The commonly cited 1979-1980
          Duke University origin is unverified in this version.
        citations:
          - ref: isoc_brief_history
            quote: "spawned USENET, based on UNIX' built-in UUCP communication protocols"
      purpose:
        basis: sourced
        text: >-
          Distributing news articles organised into newsgroups, so that each reader can see all articles posted to
          the newsgroups they take part in. Copies propagate by flooding among participating servers.
        citations:
          - ref: rfc5537
            quote: "will be able to see all articles posted to each newsgroup in which he participates"
          - ref: rfc5537
            quote: "These protocols most commonly use a flooding algorithm that propagates copies throughout a network of participating servers."
      public_disclosure:
        basis: sourced
        text: >-
          The message format was published as RFC 850 (June 1983) and RFC 1036 (December 1987), and NNTP as RFC 977
          (February 1986).
        citations:
          - ref: rfc850
            quote: "June 1983 Standard for Interchange of USENET Messages"
          - ref: rfc1036
            quote: "December 1987 Standard for Interchange of USENET Messages"
          - ref: rfc977
            quote: "February 1986 Network News Transfer Protocol"
      architecture:
        basis: sourced
        text: >-
          A federation of news servers. Articles flood between peered servers, usually with one stored copy per server
          served to local readers. Usenet is one particular public network built on the Netnews protocols.
        citations:
          - ref: rfc5537
            quote: "Typically, only one copy is stored per server"
          - ref: rfc5537
            quote: "\"Usenet\" is a particular worldwide, publicly accessible network based on the Netnews protocols."
      protocols:
        basis: sourced
        text: UUCP historically, then NNTP (RFC 977, superseded by RFC 3977).
        citations:
          - ref: rfc977
            quote: "NNTP specifies a protocol for the distribution, inquiry, retrieval, and posting of news articles"
          - ref: rfc3977
            quote: "Network News Transfer Protocol (NNTP)"
      resource_identification:
        basis: sourced
        text: >-
          Each article has a Message-ID, a unique identifier that may not be reused during the lifetime of an
          earlier message. Articles are posted to named newsgroups (e.g. news.announce).
        citations:
          - ref: rfc1036
            quote: "The \"Message-ID\" line gives the message a unique identifier."
          - ref: rfc1036
            quote: "Newsgroups: news.announce"
      discovery:
        basis: analysis
        text: >-
          Subscribing to newsgroups in the hierarchy, with articles arriving by flooding. Archives (third-party) provide
          search over historical posts.
      documentation:
        basis: sourced
        text: RFCs 850, 1036, 977, 3977 and 5537.
        citations:
          - ref: rfc5537
            quote: "Netnews Architecture and Protocols"
      infrastructure_relationship:
        basis: sourced
        text: >-
          Built on UNIX's UUCP communication protocols. NNTP later carried news as a reliable stream among the ARPA-
          Internet community. Netnews protocols are also used in deployments other than Usenet.
        citations:
          - ref: isoc_brief_history
            quote: "spawned USENET, based on UNIX' built-in UUCP communication protocols"
          - ref: rfc977
            quote: "using a reliable stream-based transmission of news among the ARPA-Internet community"
          - ref: rfc5537
            quote: "there are deployments of the Netnews protocols other than Usenet"
      distinguishing_characteristics:
        basis: analysis
        text: >-
          An early large-scale federated information ecosystem with no central server. Content is replicated by
          flooding, and a "Path" header records propagation.
      limitations:
        basis: analysis
        text: >-
          Server retention limits mean history is lost unless archived. Spam and abuse controls rely on operator
          cooperation. Native NNTP (port 119) is closed in the current cloud environment.
      comparison:
        basis: analysis
        text: >-
          Shares the federation pattern with email, which is older (see federated.origin), and with later systems
          such as ActivityPub and Matrix. Usenet floods articles to all peered servers, while ActivityPub delivers
          to subscribers. The Web's 1991 description was posted to a Usenet group (see www.public_disclosure).
  # =====================================================================================
  - id: dht
    name: Distributed hash tables
    kind: pattern
    lifecycle: mixed
    layers: [overlay]
    topology: [distributed, peer_to_peer]
    resource_identification_types: [content_hash, public_key]
    discovery_types: [dht_lookup]
    patterns: [distributed_hash_table]
    related: [p2p, ipfs, i2p, gnunet]
    examples: [Chord, Kademlia, BitTorrent Mainline DHT (BEP 5), IPFS DHT, I2P netDb]
    last_reviewed: 2026-11-24
    facets:
      origin:
        basis: sourced
        text: >-
          Structured lookup overlays were published by 2001 (Chord at SIGCOMM 2001). Kademlia (IPTPS 2002) uses an
          XOR distance metric. Its PDF couldn't be machine-checked, but BEP 5 states the XOR metric for Kademlia.
        citations:
          - ref: chord_sigcomm2001
            quote: "SIGCOMM'01, August 27-31, 2001, San Diego, California, USA."
          - ref: kademlia_iptps2002
            quote: "Kademlia: A Peer-to-peer Information System Based on the XOR Metric"
          - ref: bep5
            quote: "In Kademlia, the distance metric is XOR and the result is interpreted as an unsigned integer."
      purpose:
        basis: sourced
        text: To efficiently locate the node that stores a particular data item in a peer-to-peer system.
        citations:
          - ref: chord_sigcomm2001
            quote: "A fundamental problem that confronts peer-to-peer applications is to efficiently locate the node that stores a particular data item."
      public_disclosure:
        basis: sourced
        text: Disclosed through peer-reviewed research papers.
        citations:
          - ref: chord_sigcomm2001
            quote: "Chord: A Scalable Peer-to-peer Lookup Service for Internet Applications"
      architecture:
        basis: sourced
        text: >-
          Nodes and keys share an identifier space, and each key maps onto a responsible node. Chord supports exactly
          that one operation.
        citations:
          - ref: chord_sigcomm2001
            quote: "Chord provides support for just one operation: given a key, it maps the key onto a node."
      protocols:
        basis: sourced
        text: Instance-specific. BitTorrent's Mainline DHT (BEP 5) uses Kademlia with XOR distance.
        citations:
          - ref: bep5
            quote: "In Kademlia, the distance metric is XOR and the result is interpreted as an unsigned integer."
      resource_identification:
        basis: analysis
        text: Keys are fixed-length identifiers, typically hashes of content or of public keys.
      discovery:
        basis: analysis
        text: Iterative or recursive lookup converging on the nodes closest to a key in the identifier metric.
      documentation:
        basis: sourced
        text: Research papers plus protocol specifications of deployed instances (e.g. BEP 5).
        citations:
          - ref: bep5
            quote: "DHT Protocol"
      infrastructure_relationship:
        basis: analysis
        text: An overlay pattern used as a component by many systems, not a standalone information ecosystem.
      distinguishing_characteristics:
        basis: analysis
        text: Logarithmic lookup without central index, using an identifier-space metric and routing tables.
      limitations:
        basis: analysis
        text: >-
          Vulnerable to Sybil and eclipse attacks without countermeasures, and churn costs maintenance traffic. For
          recognition, a DHT is a component signature and doesn't identify a single system.
      comparison:
        basis: analysis
        text: >-
          Compared with flooding (Usenet): targeted lookup rather than full replication. Compared with a central tracker:
          no single point of failure.

  # =====================================================================================
  - id: p2p
    name: Peer-to-peer architectures
    kind: pattern
    lifecycle: mixed
    layers: [overlay, application]
    topology: [peer_to_peer, hybrid, distributed]
    resource_identification_types: [content_hash, location_url]
    discovery_types: [tracker, dht_lookup, out_of_band]
    patterns: [swarming, distributed_hash_table]
    related: [dht, ipfs, zeronet, hyphanet]
    examples: [BitTorrent, Bitcoin, IPFS, Hyphanet]
    last_reviewed: 2026-11-24
    facets:
      origin:
        basis: analysis
        text: >-
          A design paradigm rather than a single invention. RFC 5694 surveys its definition and taxonomies (see
          documentation). Historical first instances aren't asserted in this version.
      purpose:
        basis: sourced
        text: To share resources directly between participants instead of through a central server or intermediary.
        citations:
          - ref: bep3
            quote: "when multiple downloads of the same file happen concurrently, the downloaders upload to each other"
          - ref: bitcoin_whitepaper
            quote: "A purely peer-to-peer version of electronic cash would allow online payments to be sent directly from one party to another without going through a financial institution."
      public_disclosure:
        basis: sourced
        text: Through specifications, whitepapers and IAB/IETF surveys.
        citations:
          - ref: rfc5694
            quote: "In this document, we provide a survey of P2P (Peer-to-Peer) systems."
      architecture:
        basis: sourced
        text: >-
          RFC 5694 provides a definition and several taxonomies of P2P systems, and discusses when to design an
          application with a P2P paradigm or a different model such as client-server.
        citations:
          - ref: rfc5694
            quote: "The survey includes a definition and several taxonomies of P2P systems."
          - ref: rfc5694
            quote: "using a P2P paradigm or a different model (e.g., a client-server paradigm)"
      protocols:
        basis: sourced
        text: >-
          Instance-specific. BitTorrent combines a tracker (central coordinator) with peer swarming, which makes it a
          hybrid design.
        citations:
          - ref: bep3
            quote: "A BitTorrent tracker"
      resource_identification:
        basis: sourced
        text: >-
          Instance-specific. BitTorrent identifies content by URL and is designed to integrate with the web.
        citations:
          - ref: bep3
            quote: "It identifies content by URL and is designed to integrate seamlessly with the web."
      discovery:
        basis: analysis
        text: Trackers, DHTs, peer exchange, or out-of-band sharing of identifiers.
      documentation:
        basis: sourced
        text: RFC 5694 plus instance specifications (BEPs, whitepapers).
        citations:
          - ref: rfc5694
            quote: "Peer-to-Peer (P2P) Architecture: Definition, Taxonomies, Examples, and Applicability"
      infrastructure_relationship:
        basis: analysis
        text: Usually an overlay on the Internet. Some instances bootstrap through web servers (trackers, metainfo files).
      distinguishing_characteristics:
        basis: analysis
        text: Participants are both consumers and providers, so capacity scales with participation.
      limitations:
        basis: analysis
        text: >-
          NAT traversal, free-riding, Sybil attacks and legal misuse. "P2P" is too broad to be a useful recognition label
          alone, so it should be a parent family with sub-families.
      comparison:
        basis: analysis
        text: The parent pattern of the DHT, swarming and friend-to-friend designs in this taxonomy. Federation differs in that servers stay distinct from clients.

  # =====================================================================================
  - id: mesh
    name: Mesh networks
    kind: pattern
    lifecycle: mixed
    layers: [physical, link, network]
    topology: [distributed, decentralized, peer_to_peer]
    resource_identification_types: [network_address, public_key]
    discovery_types: [routing_announcements, manual_peering]
    patterns: [mesh_routing]
    related: [experimental_protocols, private_intranet]
    examples: [OLSR, Babel, B.A.T.M.A.N. (batman-adv), Meshtastic, Reticulum]
    last_reviewed: 2026-11-24
    facets:
      origin:
        basis: sourced
        text: >-
          IETF MANET work on routing for mobile ad hoc networks was documented in RFC 2501 (January 1999), and OLSR
          was published as an Experimental RFC in October 2003.
        citations:
          - ref: rfc2501
            quote: "January 1999 Mobile Ad hoc Networking"
          - ref: rfc3626
            quote: "October 2003 Optimized Link State Routing Protocol (OLSR)"
          - ref: rfc3626
            quote: "Category: Experimental"
      purpose:
        basis: sourced
        text: >-
          Communication where infrastructure is missing or unreliable. For example, Meshtastic uses inexpensive LoRa
          radios for long-range off-grid communication.
        citations:
          - ref: meshtastic_docs
            quote: "radios as a long range off-grid communication platform in areas without existing or reliable communications infrastructure"
      public_disclosure:
        basis: analysis
        text: Through IETF RFCs and open-source community projects.
      architecture:
        basis: sourced
        text: >-
          batman-adv implements the B.A.T.M.A.N. routing protocol as a Linux kernel module at layer 2. OLSR is a
          routing protocol for mobile ad hoc networks.
        citations:
          - ref: batman_adv_docs
            quote: "is an implementation of the B.A.T.M.A.N. routing protocol in form of a Linux kernel module operating on layer 2"
          - ref: rfc3626
            quote: "This document describes the Optimized Link State Routing (OLSR) protocol for mobile ad hoc networks."
      protocols:
        basis: sourced
        text: >-
          OLSR (link-state, using multipoint relays) and Babel (loop-avoiding distance-vector, for wired and
          wireless mesh networks).
        citations:
          - ref: rfc3626
            quote: "The key concept used in the protocol is that of multipoint relays (MPRs)."
          - ref: rfc8966
            quote: "Babel is a loop-avoiding, distance-vector routing protocol that is robust and efficient both in ordinary wired networks and in wireless mesh networks."
      resource_identification:
        basis: unverified
        text: >-
          Usually IP addresses. Some stacks (Reticulum, Yggdrasil) are reported to derive addresses from public
          keys. Neither claim was checked against a retrieved source in this version.
      discovery:
        basis: analysis
        text: Neighbour discovery and routing announcements; community maps for physical nodes.
      documentation:
        basis: sourced
        text: RFCs for routing protocols and project documentation for community stacks.
        citations:
          - ref: reticulum_home
            quote: "Reticulum is the cryptography-based networking stack for building local and wide-area networks with readily available hardware."
      infrastructure_relationship:
        basis: analysis
        text: >-
          Can be fully independent of the Internet (own radios) or bridge to it. It is one of the few families in
          this taxonomy that can include its own physical layer (ARPANET also had its own switching nodes).
      distinguishing_characteristics:
        basis: sourced
        text: >-
          Some stacks target very poor links. Reticulum, for example, is designed to keep operating with very high
          latency and extremely low bandwidth.
        citations:
          - ref: reticulum_home
            quote: "Reticulum can continue to operate even in adverse conditions with very high latency and extremely low bandwidth."
      limitations:
        basis: analysis
        text: >-
          Observable only locally (radio range) or through published maps. Remote discovery of a radio mesh without any
          Internet presence is not possible for Abyss, which is a fundamental observability limit.
      comparison:
        basis: analysis
        text: >-
          Compared with overlays (Tor, Yggdrasil): a mesh can own the physical and link layers, where overlays reuse the
          Internet. Yggdrasil targets both.

  # =====================================================================================
  - id: federated
    name: Federated information systems
    kind: pattern
    lifecycle: mixed
    layers: [application, information_ecosystem]
    topology: [federated, decentralized]
    resource_identification_types: [user_at_domain, location_url, message_id]
    discovery_types: [federation_protocol, naming_resolution, hyperlinks]
    patterns: [federation]
    related: [usenet, www]
    examples: [Email (SMTP), XMPP, Usenet, Matrix, ActivityPub (fediverse)]
    last_reviewed: 2026-11-24
    facets:
      origin:
        basis: sourced
        text: >-
          Electronic mail was introduced on the ARPANET in 1972, and Netnews (Usenet) message standards were
          published in 1983. A recent federation standard is ActivityPub, a W3C Recommendation dated 23 January
          2018.
        citations:
          - ref: isoc_brief_history
            quote: "It was also in 1972 that the initial"
          - ref: isoc_brief_history
            quote: "application, electronic mail, was introduced"
          - ref: rfc850
            quote: "June 1983 Standard for Interchange of USENET Messages"
          - ref: w3c_activitypub
            quote: "W3C Recommendation 23 January 2018"
      purpose:
        basis: sourced
        text: Decentralized communication across independently operated servers with no single point of control.
        citations:
          - ref: matrix_spec
            quote: "over a global open federation of servers with no single point of control"
      public_disclosure:
        basis: sourced
        text: Through open standards bodies (IETF, W3C) and public specifications.
        citations:
          - ref: w3c_activitypub
            quote: "W3C Recommendation 23 January 2018"
      architecture:
        basis: sourced
        text: >-
          ActivityPub has two layers: a server-to-server federation protocol and a client-to-server protocol.
        citations:
          - ref: w3c_activitypub
            quote: "A server to server federation protocol (so decentralized websites can share information)"
          - ref: w3c_activitypub
            quote: "A client to server protocol"
      protocols:
        basis: sourced
        text: SMTP (email transport), XMPP (XML streams), ActivityPub (ActivityStreams 2.0) and the Matrix APIs.
        citations:
          - ref: rfc5321
            quote: "This document is a specification of the basic protocol for Internet electronic mail transport."
          - ref: rfc6120
            quote: "The Extensible Messaging and Presence Protocol (XMPP) is an application profile of the Extensible Markup Language (XML)"
          - ref: w3c_activitypub
            quote: "The ActivityPub protocol is a decentralized social networking protocol based upon the [ActivityStreams] 2.0 data format."
      resource_identification:
        basis: analysis
        text: user@domain identifiers (email, XMPP JIDs, fediverse handles) and HTTP URIs for objects (ActivityPub).
      discovery:
        basis: analysis
        text: >-
          Following and subscriptions, server-to-server delivery, DNS for server location, and per-server or
          relay-based search. No global index exists by design.
      documentation:
        basis: sourced
        text: IETF RFCs, W3C Recommendations and the Matrix specification.
        citations:
          - ref: matrix_spec
            quote: "Matrix defines a set of open APIs for decentralised communication"
      infrastructure_relationship:
        basis: analysis
        text: An application layer over the Internet and DNS. Each server is an ordinary Internet host.
      distinguishing_characteristics:
        basis: analysis
        text: Servers are distinct from clients (unlike P2P), but no single server controls the network (unlike centralized services).
      limitations:
        basis: analysis
        text: >-
          Content visibility depends on which servers federate with which. There's no complete public view, so
          "absent from search" is common and is not evidence of hiddenness.
      comparison:
        basis: analysis
        text: >-
          Usenet floods everything to all peers, while ActivityPub and Matrix deliver to subscribers. Email is an
          early, widely deployed instance (see origin).
  # =====================================================================================
  - id: experimental_protocols
    name: Experimental networking architectures
    kind: category
    lifecycle: experimental
    layers: [network, overlay]
    topology: [distributed, decentralized]
    resource_identification_types: [name_prefix, public_key, network_address]
    discovery_types: [routing_announcements, manual_peering]
    patterns: [information_centric_networking, path_aware_networking, self_certifying_names]
    related: [mesh, ipfs]
    examples: [Named Data Networking (NDN), SCION, Yggdrasil, Reticulum]
    last_reviewed: 2026-11-24
    facets:
      origin:
        basis: sourced
        text: >-
          A heterogeneous category. Example: the NDN project launched with NSF funding in September 2010 under the NSF
          Future Internet Architecture Program.
        citations:
          - ref: ndn_project
            quote: "The NDN project was launched with National Science Foundation funding in September 2010 as one of the four projects under NSF's Future Internet Architecture Program."
      purpose:
        basis: sourced
        text: >-
          To explore alternatives to current Internet routing and addressing. Example: Yggdrasil aims to be a
          decentralised alternative to structured routing protocols.
        citations:
          - ref: yggdrasil_home
            quote: "It is designed to be a future-proof and decentralised alternative to the structured routing protocols commonly used today on the Internet"
      public_disclosure:
        basis: analysis
        text: Research programmes, papers, IETF drafts and open-source repositories.
      architecture:
        basis: sourced
        text: >-
          Varies by system. Yggdrasil is an experimental compact routing scheme for end-to-end encrypted IPv6
          networking, and SCION describes itself as a more secure and reliable Internet. The NDN and SCION
          architectures aren't quoted in this version (see open questions).
        citations:
          - ref: yggdrasil_home
            quote: "Yggdrasil is a new experimental compact routing scheme."
          - ref: yggdrasil_home
            quote: "End-to-end encrypted IPv6 networking"
          - ref: scion_home
            quote: "SCION, a more secure and reliable Internet"
      protocols:
        basis: unverified
        text: >-
          Instance-specific: NDN Interest/Data packets, SCION path construction and Yggdrasil routing. None of these
          were quoted from a retrieved source in this version.
      resource_identification:
        basis: unverified
        text: >-
          Reported: named-data prefixes (NDN), key-derived IPv6 addresses (Yggdrasil) and conventional addresses
          with path information (SCION). Not checked against retrieved sources in this version.
      discovery:
        basis: analysis
        text: Routing announcements and manual peering. Public peer lists exist for some overlays.
      documentation:
        basis: sourced
        text: Project sites and research publications.
        citations:
          - ref: ndn_project
            quote: "Named Data Networking"
      infrastructure_relationship:
        basis: analysis
        text: Mostly deployed as overlays or testbeds on the Internet, although some target eventual replacement of current layers.
      distinguishing_characteristics:
        basis: analysis
        text: The category exists because these systems redefine the network layer's identity or routing model, which makes them prime test cases for "unknown architecture" recognition.
      limitations:
        basis: analysis
        text: >-
          The category is defined by being non-mainstream, which isn't an architectural property. For recognition
          benchmarks, each instance should be its own family or held-out family, not lumped together.
      comparison:
        basis: analysis
        text: NDN and IPFS both name data rather than hosts, NDN at the network layer and IPFS as an overlay. Yggdrasil shares goals with mesh networks.

  # =====================================================================================
    open_questions:
      - "Register NDN and SCION architecture specifications to source the architecture, protocols and resource identification facets."
  - id: private_intranet
    name: Private intranet architectures
    kind: pattern
    lifecycle: mixed
    layers: [network, transport, application]
    topology: [centralized, hierarchical, client_server]
    resource_identification_types: [network_address, location_url, human_name_registry]
    discovery_types: [directory_listing, naming_resolution]
    patterns: [private_addressing, tunneling, zero_trust]
    related: [arpanet, mesh, federated]
    examples: [RFC 1918 private addressing, BGP/MPLS VPNs, WireGuard tunnels, zero-trust architectures]
    last_reviewed: 2026-11-24
    facets:
      origin:
        basis: sourced
        text: Private address space was formalised by RFC 1918 (BCP, February 1996).
        citations:
          - ref: rfc1918
            quote: "February 1996 Address Allocation for Private Internets"
      purpose:
        basis: sourced
        text: To build networks for an organisation's own hosts that aren't routed on the public Internet.
        citations:
          - ref: rfc1918
            quote: "has reserved the following three blocks of the IP address space for private internets"
      public_disclosure:
        basis: analysis
        text: >-
          The architecture is public (RFCs, NIST). Specific intranets are private by definition, and Abyss must not
          attempt to discover them without authorisation.
      architecture:
        basis: sourced
        text: >-
          Private addressing behind gateways. Provider VPNs (BGP/MPLS) and encrypted tunnels (WireGuard) extend private
          networks across public infrastructure. Zero-trust architectures remove implicit trust based on location.
        citations:
          - ref: rfc4364
            quote: "This document describes a method by which a Service Provider may use an IP backbone to provide IP Virtual Private Networks (VPNs) for its customers."
          - ref: wireguard_paper
            quote: "WireGuard is a secure network tunnel, operating at layer 3"
          - ref: nist_sp800_207
            quote: "Zero trust assumes there is no implicit trust granted to assets or user accounts based solely on their physical or network location"
      protocols:
        basis: sourced
        text: Standard IP stacks plus tunnelling protocols. WireGuard's key exchange is based on Noise IK.
        citations:
          - ref: wireguard_paper
            quote: "It uses a single round trip key exchange, based on NoiseIK"
      resource_identification:
        basis: sourced
        text: >-
          RFC 1918 reserves three blocks for private internets: 10/8, 172.16/12 and 192.168/16.
        citations:
          - ref: rfc1918
            quote: "10.0.0.0 - 10.255.255.255 (10/8 prefix)"
          - ref: rfc1918
            quote: "172.16.0.0 - 172.31.255.255 (172.16/12 prefix)"
          - ref: rfc1918
            quote: "192.168.0.0 - 192.168.255.255 (192.168/16 prefix)"
      discovery:
        basis: analysis
        text: Internal directories, internal DNS and search. They aren't visible from outside, which is why they're out of scope without authorisation.
      documentation:
        basis: sourced
        text: RFCs and NIST guidance.
        citations:
          - ref: nist_sp800_207
            quote: "NIST Special Publication 800-207 Zero Trust Architecture"
      infrastructure_relationship:
        basis: sourced
        text: Overlaid on or carved out of public infrastructure. Zero trust moves defences from network perimeters to resources.
        citations:
          - ref: nist_sp800_207
            quote: "move defenses from static, network-based perimeters to focus on users, assets, and resources"
      distinguishing_characteristics:
        basis: analysis
        text: Defined by access control and non-routability, not by a novel information model.
      limitations:
        basis: analysis
        text: >-
          Only owner-authorised intranets (OWNER_AUTHORIZED sources) or lab networks (LAB_OWNED) may be studied. Absence
          from public view is the designed behaviour, not an anomaly.
      comparison:
        basis: analysis
