  - id: gopher
    name: Gopher
    kind: system
    lifecycle: operational
    layers: [application, information_ecosystem]
    topology: [client_server, decentralized]
    resource_identification_types: [host_selector, location_url]
    discovery_types: [directory_listing, search_engine]
    patterns: [client_server, menu_hierarchy]
    related: [www, gemini]
    last_reviewed: 2026-11-24
    facets:
      origin:
        basis: sourced
        text: Developed at the University of Minnesota. The protocol was documented as RFC 1436 in March 1993.
        citations:
          - ref: rfc1436
            quote: "University of Minnesota March 1993"
      purpose:
        basis: sourced
        text: A distributed document search and retrieval protocol.
        citations:
          - ref: rfc1436
            quote: "The Internet Gopher Protocol (a distributed document search and retrieval protocol)"
      public_disclosure:
        basis: sourced
        text: >-
          Published as an Informational RFC (not an Internet standard). The 1991 origin date is commonly cited but not
          verified in this version.
        citations:
          - ref: rfc1436
            quote: "This memo provides information for the Internet community. It does not specify an Internet standard."
      architecture:
        basis: sourced
        text: Client-server, with documents residing on many autonomous servers and accessed by hierarchical menus.
        citations:
          - ref: rfc1436
            quote: "Documents reside on many autonomous servers on the Internet."
      protocols:
        basis: sourced
        text: >-
          A simple request/response over TCP. The client sends a selector string and the server returns a menu or a
          document. The IANA-assigned port is 70.
        citations:
          - ref: rfc1436
            quote: "Gopher servers should listen on port 70 (port 70 is assigned to Internet Gopher by IANA)."
      resource_identification:
        basis: sourced
        text: A host, a port and a selector string, with item types. Later given a URI scheme (RFC 4266).
        citations:
          - ref: rfc4266
            quote: "The gopher URI Scheme"
      discovery:
        basis: analysis
        text: >-
          Browsing menus and links between servers. Gopher-specific search services existed (commonly cited: Veronica),
          but they're not verified in this version.
      documentation:
        basis: sourced
        text: RFC 1436 and RFC 4266.
        citations:
          - ref: rfc1436
            quote: "The Internet Gopher Protocol"
      infrastructure_relationship:
        basis: sourced
        text: An application protocol over TCP on the Internet.
        citations:
          - ref: rfc1436
            quote: "This protocol assumes a reliable data stream; TCP is assumed."
      distinguishing_characteristics:
        basis: analysis
        text: >-
          Strict menu-and-document model with typed items. Easy to implement and to index, but it lacks inline
          hypertext. Whether a Gopherspace community is still active, and how large it is, is not measured in this version.
      limitations:
        basis: analysis
        text: >-
          No encryption in the base protocol and no inline links. Abyss can't reach native Gopher (port 70) from the
          current cloud environment (outbound port closed), so live Gopher ingestion is BLOCKED here.
      comparison:
        basis: sourced
        text: Gemini explicitly positions itself as an incremental improvement over Gopher rather than a stripped-down HTTP.
        citations:
          - ref: gemini_spec
            quote: "It can be thought of as an incremental improvement over Gopher [RFC1436] rather than a stripped down HTTP"

