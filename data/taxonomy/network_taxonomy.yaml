        citations:
          - ref: gemini_spec
            quote: "with a simple request and response transaction"
      protocols:
        basis: sourced
        text: >-
          The Gemini protocol on TCP port 1965 with mandatory TLS. Clients are strongly recommended to use
          Trust-On-First-Use certificate pinning.
        citations:
          - ref: gemini_spec
            quote: "It runs over TCP [STD7] port 1965 with encryption provided by TLS [RFC8446]"
          - ref: gemini_spec
            quote: "Clients are strongly RECOMMENDED to use a Trust on First Use or \"TOFU\" certificate-pinning system"
      resource_identification:
        basis: sourced
        text: gemini:// URIs (location-based).
        citations:
          - ref: gemini_spec
            quote: "gemini://example.net/search?hello"
      discovery:
        basis: analysis
        text: >-
          Links in gemtext documents, community aggregators and Gemini-native search engines. Total size is
          unmeasured by Abyss.
      documentation:
        basis: sourced
        text: Specification and FAQ at geminiprotocol.net (also served natively over Gemini).
        citations:
          - ref: gemini_spec
            quote: "This document specifies the Gemini protocol for file transfer."
      infrastructure_relationship:
        basis: analysis
        text: >-
          An application protocol over TCP/TLS on the Internet. It uses DNS hostnames, and TOFU avoids dependence on
          the CA system.
      distinguishing_characteristics:
        basis: sourced
        text: '"Geminispace" names the total collection of content served over Gemini, by analogy with Gopherspace.'
        citations:
          - ref: gemini_faq
            quote: "\"Geminispace\" is simply the total collection of every single file that is served via the Gemini protocol."
      limitations:
        basis: analysis
        text: >-
          Deliberately minimal (no inline media or scripting). Native port 1965 is closed in the current cloud
          environment, so the Phase 0 citations came from the project's HTTPS mirror and native ingestion is BLOCKED here.
      comparison:
        basis: sourced
        text: Positioned between Gopher and the Web, as an improvement over Gopher rather than a stripped-down HTTP.
        citations:
          - ref: gemini_spec
            quote: "It can be thought of as an incremental improvement over Gopher [RFC1436] rather than a stripped down HTTP"

