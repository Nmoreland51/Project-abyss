  # =====================================================================================
  - id: gnunet
    name: GNUnet
    kind: system
    lifecycle: operational
    layers: [overlay, application]
    topology: [peer_to_peer, decentralized]
    resource_identification_types: [public_key, human_name_registry]
    discovery_types: [dht_lookup, naming_resolution]
    patterns: [distributed_hash_table, self_certifying_names]
    related: [i2p, tor, hyphanet]
    last_reviewed: 2026-11-24
    facets:
      origin:
        basis: sourced
        text: >-
          Maintained by GNUnet e.V. The site's copyright notice runs from 2001, which is weak evidence of the start
          date. The founding history, and whether GNUnet is an official GNU package, weren't verified in this
          version (the GNU Project is listed among its hosting supporters).
        citations:
          - ref: gnunet_home
            quote: "Copyright © GNUnet e.V. 2001"
          - ref: gnunet_about
            quote: "The GNU Project"
      purpose:
        basis: sourced
        text: >-
          A Free Software network architecture following a decentralized peer-to-peer paradigm with privacy-preserving
          cryptographic protocols.
        citations:
          - ref: gnunet_about
            quote: "We believe liberal societies need a network architecture that uses the anti-authoritarian decentralized peer-to-peer paradigm and privacy-preserving cryptographic protocols."
          - ref: gnunet_about
            quote: "The goal of the GNUnet project is to provide a Free Software realization of this ideal."
      public_disclosure:
        basis: sourced
        text: >-
          The GNU Name System was published as RFC 9498 in November 2023, an Informational RFC from the Independent
          Submission stream.
        citations:
          - ref: rfc9498
            quote: "November 2023 The GNU Name System"
          - ref: rfc9498
            quote: "Category: Informational"
          - ref: rfc9498
            quote: "Independent Submission"
      architecture:
        basis: unverified
        text: >-
          A layered P2P framework (transport, core, DHT, applications). The DHT is commonly identified as R5N. Not
          quoted from a retrieved source in this version.
      protocols:
        basis: sourced
        text: GNS is specified as a decentralized, censorship-resistant name resolution protocol.
        citations:
          - ref: rfc9498
            quote: "GNS is a decentralized and censorship-resistant domain name resolution protocol that provides a privacy-enhancing alternative to the Domain Name System (DNS) protocols."
      resource_identification:
        basis: sourced
        text: >-
          Names are resolved within zones that have zone keys (a blinded key is derived from a zone key and a
          label), with zone top-level domains (zTLDs) and the delegation record types PKEY and EDKEY.
        citations:
          - ref: rfc9498
            quote: "A blinded zone key is a key derived from a zone key and a label."
          - ref: rfc9498
            quote: "Zone Top-Level Domain (zTLD)"
          - ref: rfc9498
            quote: "5.1.1. PKEY 5.1.2. EDKEY"
      discovery:
        basis: sourced
        text: Name resolution through GNS, with DHTs used as remote storage for records.
        citations:
          - ref: rfc9498
            quote: "DHTs as Remote Storage"
      documentation:
        basis: sourced
        text: Project handbook and an RFC-published specification for GNS. The GNU Name System is called its most mature component.
        citations:
          - ref: gnunet_about
            quote: "start with its most mature component, the GNU Name System"
      infrastructure_relationship:
        basis: analysis
        text: Runs on Internet hosts. GNS is positioned as an alternative to DNS, not a replacement for IP.
      distinguishing_characteristics:
        basis: analysis
        text: >-
          A whole privacy-oriented networking stack in one framework, with a decentralized naming system published
          as an Informational RFC (not a standard) that other projects could adopt independently.
      limitations:
        basis: analysis
        text: >-
          The project itself names GNS as its most mature component, which implies other components are less mature.
          The start date rests only on a copyright notice.
      comparison:
        basis: analysis
        text: >-
          Compared with I2P: both are full-stack privacy P2P with their own naming, but GNUnet's naming is formally
          specified in an RFC. Compared with DNS: key-based delegation without a root authority.
    open_questions:
      - "Register GNUnet handbook and the R5N paper to upgrade 'architecture'."

