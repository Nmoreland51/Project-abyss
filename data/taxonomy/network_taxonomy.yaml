        citations:
          - ref: gemini_faq
            quote: "Project Gemini started in June 2019."
      purpose:
        basis: sourced
        text: To coexist alongside Gopher and the Web as one more option, explicitly not to replace them.
        citations:
          - ref: gemini_faq
            quote: "Gemini is not intended to replace either Gopher or the web, but to co-exist peacefully alongside them"
      public_disclosure:
        basis: analysis
