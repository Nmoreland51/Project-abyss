  - id: ipfs
    name: IPFS
    aliases: [InterPlanetary File System]
    kind: system
    lifecycle: operational
    layers: [overlay, application, information_ecosystem]
    topology: [peer_to_peer, distributed]
    resource_identification_types: [content_hash, public_key]
    discovery_types: [dht_lookup, out_of_band]
    patterns: [content_addressing, distributed_hash_table, swarming]
    related: [dht, p2p, hyphanet, zeronet]
    last_reviewed: 2026-11-24
    facets:
      origin:
        basis: sourced
        text: Described in Juan Benet's arXiv preprint, submitted 14 July 2014.
        citations:
          - ref: ipfs_whitepaper_arxiv
            quote: "Submitted on 14 Jul 2014"
          - ref: ipfs_whitepaper_arxiv
            quote: "IPFS - Content Addressed, Versioned, P2P File System"
      purpose:
        basis: sourced
        text: A peer-to-peer distributed file system intended to connect all computing devices with the same system of files.
        citations:
          - ref: ipfs_whitepaper_arxiv
            quote: "The InterPlanetary File System (IPFS) is a peer-to-peer distributed file system that seeks to connect all computing devices with the same system of files."
      public_disclosure:
        basis: sourced
        text: Disclosed by public preprint (2014) and open-source implementations with public documentation.
        citations:
          - ref: ipfs_whitepaper_arxiv
            quote: "Submitted on 14 Jul 2014"
      architecture:
        basis: sourced
        text: >-
          A set of open protocols for addressing, routing and transferring content-addressed data. A Kademlia-based DHT
          is used for content routing, mapping identifiers to providing peers.
        citations:
          - ref: ipfs_docs_what
            quote: "IPFS is a set of open protocols for addressing, routing, and transferring"
          - ref: ipfs_docs_dht
            quote: "In IPFS, the DHT is used as the fundamental component of the content routing system"
      protocols:
        basis: sourced
        text: >-
          The Kademlia DHT and IPNS (mutable naming) are quoted here. Bitswap (block exchange), IPLD (data model) and
          libp2p (networking) are named in the documentation navigation but not quoted in this version.
        citations:
          - ref: ipfs_docs_dht
            quote: "Kademlia"
          - ref: ipfs_docs_dht
            quote: "IPNS (InterPlanetary Name System)"
      resource_identification:
        basis: sourced
        text: Content Identifiers (CIDs) derived from the content's cryptographic hash (sha-256 by default).
        citations:
          - ref: ipfs_docs_cid
            quote: "CIDs are based on the content's cryptographic hash."
          - ref: ipfs_docs_cid
            quote: "IPFS uses the sha-256 hashing algorithm by default"
      discovery:
        basis: sourced
        text: Provider records in the DHT map a content identifier to peers that advertise they have it.
        citations:
          - ref: ipfs_docs_dht
            quote: "It maps what the user is looking for to the peer that is storing the matching content."
      documentation:
        basis: sourced
        text: Public documentation at docs.ipfs.tech, plus the 2014 preprint (which differs from current implementations).
        citations:
          - ref: ipfs_docs_what
            quote: "What is IPFS"
      infrastructure_relationship:
        basis: analysis
        text: >-
          An overlay on the Internet. HTTP gateways bridge IPFS content into the Web, so much IPFS content is reached
          through Web infrastructure rather than native peers.
      distinguishing_characteristics:
        basis: sourced
        text: Content addressing gives verifiability, since any change in content produces a different CID.
        citations:
          - ref: ipfs_docs_cid
            quote: "Any difference in the content will produce a different CID."
      limitations:
        basis: analysis
        text: >-
          Content addressing doesn't guarantee availability: content persists only while someone provides it. There's
          no anonymity, because providers are visible in the DHT. Gateway use re-centralizes access.
      comparison:
        basis: analysis
        text: >-
          Compared with BitTorrent: similar swarming and DHT ideas, generalised to a file system and linked data.
          Compared with Hyphanet: content-addressed without anonymity. Compared with the Web: what, not where.

