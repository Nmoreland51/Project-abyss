[project]
name = "threadhall-server"
version = "1.0.0"
description = "Live discussion platform backend (FastAPI modular monolith)"
requires-python = ">=3.13"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP"]
ignore = ["B008", "S101", "S105", "S106", "S608"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
