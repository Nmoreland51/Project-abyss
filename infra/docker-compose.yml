# Local development / private pilot stack. Not a public production deployment (see docs/OPERATIONS.md).
#   cp infra/.env.example infra/.env   # then change every password
#   docker compose -f infra/docker-compose.yml --env-file infra/.env up -d --build
name: threadhall

services:
  db:
    image: postgres:18.7-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
      POSTGRES_DB: threadhall
      MIGRATOR_PASSWORD: ${MIGRATOR_PASSWORD:?set MIGRATOR_PASSWORD in infra/.env}
      RUNTIME_PASSWORD: ${RUNTIME_PASSWORD:?set RUNTIME_PASSWORD in infra/.env}
    volumes:
      - dbdata:/var/lib/postgresql
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
      - ./postgres/roles.sql:/bootstrap/roles.sql:ro
      - ./postgres/database.sql:/bootstrap/database.sql:ro
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d threadhall"]
      interval: 3s
      timeout: 3s
      retries: 30

  migrate:
    build: ../server
    image: threadhall-server:dev
    command: ["alembic", "upgrade", "head"]
    environment:
      MIGRATION_DATABASE_URL: postgresql+psycopg://app_migrator:${MIGRATOR_PASSWORD}@db:5432/threadhall
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: threadhall-server:dev
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://app_runtime:${RUNTIME_PASSWORD}@db:5432/threadhall
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      # 0.0.0.0 lets a phone on the same Wi-Fi reach the pilot server. Set API_BIND=127.0.0.1 to restrict.
      - "${API_BIND:-0.0.0.0}:${API_PORT:-8000}:8000"

volumes:
  dbdata:
